name: Backup Neon DB

# El plan Free de Neon solo permite volver atrás hasta 6 horas (point-in-time
# restore). Esto guarda un dump completo todos los días como artifact del
# repo (30 días de historial), para tener margen real ante un bug o una
# migración que rompa datos y no se note el mismo día.
#
# Para restaurar un dump: pg_restore --clean --if-exists -d "$DATABASE_URL" backup.dump

on:
  schedule:
    - cron: '0 6 * * *' # 6am UTC = 3am hora Argentina
  workflow_dispatch: {}

# Least-privilege explícito -- este job ni siquiera hace checkout del repo,
# pero fijar el default de todos modos deja documentado que no necesita nada
# más que poder correr.
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    container: postgres:18-alpine
    steps:
      - name: Compute backup name
        id: meta
        run: echo "name=capymeal-db-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Dump database
        run: pg_dump "$DATABASE_URL" --format=custom --file=backup.dump
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      - name: Upload backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.meta.outputs.name }}
          path: backup.dump
          retention-days: 30

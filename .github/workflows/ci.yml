name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Least-privilege explícito: sin esto el GITHUB_TOKEN corre con el default
# del repo mientras los jobs instalan dependencias de terceros no auditadas
# (composer install / npm ci) -- solo necesita poder leer el código.
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/v0.1/backend
    # Postgres real (mismo motor que Neon en producción) como service container
    # al costado del job -- no se puede usar el patrón "container:" de
    # backup-db.yml acá, porque este job necesita PHP/apt/actions normales del
    # runner de Ubuntu, no la imagen minimal de postgres:18-alpine como entorno
    # de ejecución.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: capymeal_test
          POSTGRES_USER: capymeal
          POSTGRES_PASSWORD: capymeal
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U capymeal"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, dom, fileinfo, pdo_pgsql, gd, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: prototype/v0.1/backend/vendor
          key: composer-${{ hashFiles('prototype/v0.1/backend/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: composer lint

      - name: Static analysis (Larastan)
        run: composer phpstan

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: capymeal_test
          DB_USERNAME: capymeal
          DB_PASSWORD: capymeal
        run: php artisan test

  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/v0.1/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: prototype/v0.1/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

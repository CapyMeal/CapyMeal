<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div class="logo">
        <img src="assets/Logo.png" alt="CapyMeal">
    </div>
    <div class="title">
    <title>CapyMeal 🌸</title>
    </div>
    <link rel="stylesheet" href="styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

    <!-- Header -->

    <header class="header">

        <div>
            <h1>🌸 CapyMeal</h1>
            <p>Tu diario de pequeños momentos</p>
        </div>

        <div class="capy">
            <img src="assets/HeaderChef.png" alt="Capybara">
        </div>

    </header>


    <!-- Greeting -->

    <section class="greeting">

        <h2>Hola 🌸</h2>

        <p>
            ¿Qué guardamos de tu día?
        </p>

        <div class="date">
            <img src="assets/miDiario.png" alt="Calendario">
        </div>

    </section>



    <!-- Meals -->

    <main class="meals">


        <article class="meal-card">

            <div class="icon">
                <img src="assets/desayuno.png" alt="desayuno">
            </div>

            <div>
                <h3>Desayuno</h3>

                <textarea placeholder="¿Qué desayunaste?"></textarea>
            </div>

        </article>



        <article class="meal-card">

            <div class="icon">
                <img src="assets/almuerzo.png" alt="almuerzo">
            </div>

            <div>
                <h3>Almuerzo</h3>

                <textarea placeholder="¿Qué comiste?"></textarea>
            </div>

        </article>



        <article class="meal-card">

            <div class="icon">
                <img src="assets/merienda.png" alt="merienda">
            </div>

            <div>
                <h3>Merienda</h3>

                <textarea placeholder="¿Qué disfrutaste?"></textarea>
            </div>

        </article>



        <article class="meal-card">

            <div class="icon">
                <img src="assets/cena.png" alt="cena">
            </div>

            <div>
                <h3>Cena</h3>

                <textarea placeholder="¿Cómo cerraste el día?"></textarea>
            </div>

        </article>


    </main>



    <button class="save-button">
        🩷 Guardar mi día
    </button>


    <div class="message">

        🐹
        <span>
            Capi está esperando tus recuerdos.
        </span>

    </div>



    <!-- Navigation -->

    <nav class="bottom-nav">

        <button class="active">
            🌞
            <span>Mi Día</span>
        </button>


        <button>
            📖
            <span>Diario</span>
        </button>


        <button>
            📄
            <span>PDF</span>
        </button>


        <button>
            ⚙️
            <span>Más</span>
        </button>

    </nav>


</div>


<script src="script.js"></script>

</body>
</html>

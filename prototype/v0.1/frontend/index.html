<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Evita que Safari/iOS y algunos navegadores Android conviertan
         automáticamente el email o el nombre en Ajustes en un link que
         abre la app de Mail -->
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <!-- Soporte de "agregar a inicio" en iOS (Safari no lee el manifest
         para estos tres comportamientos, hace falta declararlos a mano) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CapyMeal" />
    <title>CapyMeal</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

services:

  db:
    image: postgres:16-alpine
    container_name: capymeal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       capymeal
      POSTGRES_USER:     capymeal
      POSTGRES_PASSWORD: capymeal
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capymeal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capymeal-backend
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV:       local
      APP_DEBUG:     "true"
      APP_URL:       http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST:       db
      DB_PORT:       5432
      DB_DATABASE:   capymeal
      DB_USERNAME:   capymeal
      DB_PASSWORD:   capymeal
      FRONTEND_URL:  http://localhost:5174
      MAIL_MAILER:   ${MAIL_MAILER:-log}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@capymeal.local}
      MAIL_FROM_NAME: CapyMeal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: capymeal-frontend
    restart: unless-stopped
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080

volumes:
  db_data:
